[package]
name = "shrincs"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
description = "SHRINCS: a semi-stateful hash-based signature scheme. Reference implementation of the draft BIP."
license = "CC0-1.0"
repository = "https://github.com/AppliedPQC/shrincs-rs"
keywords = ["cryptography", "post-quantum", "signature", "hash-based", "bitcoin"]
categories = ["cryptography", "no-std"]

[dependencies]
sha2 = { version = "0.10", default-features = false }
blake3 = { version = "1", optional = true, default-features = false }

[features]
default = []
# BLAKE3 as an alternative suite. Not SHRINCS; see hash::Blake3.
blake3 = ["dep:blake3"]

[dev-dependencies]
serde_json = "1"

[profile.test]
opt-level = 2
